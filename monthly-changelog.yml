name: Monthly Shopify Changelog Summary

on:
  schedule:
    # Runs at 9:00 AM UTC on the 1st of every month
    - cron: "0 9 1 * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  post-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: shopify-changelog-slack

      - name: Run changelog summary script
        working-directory: shopify-changelog-slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm start
